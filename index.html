    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #12121a;
            border-radius: 32px;
            padding: 30px 24px;
            border: 1px solid #1a1a2e;
            box-shadow: 0 0 60px rgba(200, 0, 255, 0.04);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #cc00ff, #ff00aa);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 30px rgba(200, 0, 255, 0.15);
        }
        .name {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #cc00ff, #ff00aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        .username {
            font-size: 14px;
            color: #888;
            margin-top: 2px;
        }
        .bio {
            font-size: 14px;
            color: #aaa;
            margin-top: 6px;
            line-height: 1.5;
        }
        .fav {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        .fav span {
            color: #cc00ff;
        }

        .divider {
            margin: 18px 0;
            border: none;
            border-top: 1px solid #1a1a2e;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 16px;
            background: #1a1a2e;
            border: 1px solid #1a1a2e;
            color: #e0e0e0;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn:hover {
            border-color: #cc00ff;
            background: #1a1a3a;
            transform: scale(1.01);
        }
        .btn .left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }
        .btn .left .icon {
            font-size: 20px;
        }
        .btn .arrow {
            color: #444;
            font-size: 18px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #333;
            letter-spacing: 0.3px;
        }
        .footer a {
            color: #cc00ff;
            text-decoration: none;
        }

        @media (max-width: 420px) {
            .container { padding: 20px 16px; }
            .avatar { width: 80px; height: 80px; font-size: 36px; }
            .name { font-size: 20px; }
        }
    </style>
